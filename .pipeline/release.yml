name: $(BuildDefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
  pipelines:
    - pipeline: signedPackages
      project: One
      source: '\OneBranch\AAPT-APIManagement\Azure-API-Management-Policy-Toolkit-Build'
      trigger: none

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    stages:
      - stage: publish
        displayName: 'Publish to NuGet.org'
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['resources.pipeline.signedPackages.sourceBranch'], 'refs/tags/v'))
        jobs:
          - deployment: publish_nuget
            displayName: 'Push signed NuGet packages'
            environment: 'nuget-org'
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  pipeline: signedPackages
                  artifactName: SignedPackages
                  targetPath: '$(Pipeline.Workspace)\SignedPackages'
            strategy:
              runOnce:
                deploy:
                  steps:
                    - task: PowerShell@2
                      displayName: 'Validate selected build'
                      inputs:
                        targetType: inline
                        script: |
                          $sourceBranch = '$(resources.pipeline.signedPackages.sourceBranch)'
                          $runName = '$(resources.pipeline.signedPackages.runName)'
                          $runId = '$(resources.pipeline.signedPackages.runID)'

                          if ($sourceBranch -notmatch '^refs/tags/v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$')
                          {
                              throw "Selected build $runId was not produced from a valid release tag."
                          }

                          $packageVersion = $Matches.version
                          if ($runName -ne $packageVersion)
                          {
                              throw "Selected build name '$runName' does not match tag version '$packageVersion'."
                          }

                          Write-Host "Publishing signed packages from build $runId for version $packageVersion."
                          Write-Host "##vso[build.updatebuildnumber]$packageVersion"

                    - task: UseDotNet@2
                      displayName: 'Setup .NET 8 SDK'
                      inputs:
                        packageType: sdk
                        version: '8.x'

                    - task: PowerShell@2
                      displayName: 'Verify signed NuGet packages'
                      inputs:
                        targetType: inline
                        script: |
                          $packages = @(Get-ChildItem -LiteralPath '$(Pipeline.Workspace)\SignedPackages' -Filter '*.nupkg')
                          if ($packages.Count -eq 0)
                          {
                              throw "No NuGet packages were downloaded from the selected build."
                          }

                          foreach ($package in $packages)
                          {
                              & dotnet nuget verify --all --verbosity detailed $package.FullName
                              if ($LASTEXITCODE -ne 0)
                              {
                                  throw "Signature verification failed for '$($package.Name)'."
                              }
                          }

                    - task: 1ES.PublishNuget@1
                      displayName: 'Push to NuGet.org'
                      inputs:
                        packagesToPush: '$(Pipeline.Workspace)\SignedPackages\*.nupkg'
                        packageParentPath: '$(Pipeline.Workspace)\SignedPackages'
                        nuGetFeedType: external
                        publishFeedCredentials: 'api-management-policy-toolkit-nuget-connection'
